<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WiFi</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="contenedor">

    <div class="tarjeta">

        <img src="../images/logo.png" class="logo" alt="Portocala Apartments">

        <p class="saludo wifi-saludo">
            <i data-lucide="wifi"></i>
            WiFi
        </p>

        <h2 id="nombre-apartamento">
            Apartamento
        </h2>

        <p class="descripcion">
            Conéctate fácilmente a la red WiFi de tu alojamiento.
        </p>

        <div class="wifi-card">

            <h3>Nombre de la red</h3>

            <div class="wifi-dato">

                <span id="wifi-ssid">
                    Cargando...
                </span>

                <button onclick="copiar('wifi-ssid')">
                    Copiar
                </button>

            </div>

            <h3>Contraseña</h3>

            <div class="wifi-dato">

                <span id="wifi-password">
                    ••••••••
                </span>

                <button id="mostrar-password">
                    Mostrar
                </button>

            </div>

            <button id="copiar-password" class="boton-principal" onclick="copiarPassword()">
                 Copiar contraseña
            </button>

            <p id="mensajeCopiado" class="mensaje-copiado"></p>

        </div>

        <a class="volver-menu" href="area-huespedes.html">
            ← Volver al menú
        </a>

    </div>

</div>

<script src="https://unpkg.com/lucide@latest"></script>

<script>
lucide.createIcons();
</script>

<script src="../js/config.js"></script>
<script src="../js/apartamentos.js"></script>
<script src="../js/app.js"></script>
<script src="../js/wifi.js"></script>

</body>
