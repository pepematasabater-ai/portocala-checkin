<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manual | Portocala Apartments</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <main class="contenedor">

        <img 
            src="../images/logo.png" 
            class="logo" 
            alt="Portocala Apartments"
        >

        <p class="saludo manual-saludo">
            <i data-lucide="book-open"></i>
            Manual
        </p>

        <h2 id="nombre-apartamento">
            Cargando...
        </h2>

        <p class="descripcion">
            Toda la información que necesitas para disfrutar
            cómodamente de tu estancia.
        </p>


        <!-- ========================================
             CONTENIDO DEL MANUAL
             ======================================== -->

        <section class="manual-card">

            <h3>Información del apartamento</h3>

            <p>
                Aquí encontrarás toda la información y normas
                necesarias durante tu estancia.
            </p>

        </section>


        <a 
            href="#"
            id="volver-menu"
            class="volver-menu"
        >
            ← Volver al menú
        </a>

    </main>


    <!-- ========================================
         LUCIDE ICONS
         ======================================== -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>


    <!-- ========================================
         JAVASCRIPT DEL PROYECTO
         ======================================== -->

    <script src="../js/config.js"></script>
    <script src="../js/apartamentos.js"></script>
    <script src="../js/app.js"></script>

</body>

</html>
